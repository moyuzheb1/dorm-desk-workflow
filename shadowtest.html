<!doctype html>
<html>
<body style="margin:0;background:#111">
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(600, 400);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2028);
const camera = new THREE.PerspectiveCamera(45, 1.5, 0.1, 1000);
camera.position.set(160, 190, 230);
camera.lookAt(0, 20, 0);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(60, 220, 140);
light.castShadow = true;
const cam = light.shadow.camera;
cam.left = -200; cam.right = 200; cam.top = 200; cam.bottom = -200;
cam.near = 1; cam.far = 900;
cam.updateProjectionMatrix();
scene.add(light, light.target, new THREE.AmbientLight(0xffffff, 0.15));

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshLambertMaterial({ color: 0x334455 }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const box = new THREE.Mesh(
  new THREE.BoxGeometry(60, 60, 60),
  new THREE.MeshLambertMaterial({ color: 0xd9dee6 }),
);
box.position.y = 30;
box.castShadow = true;
scene.add(box);

function tick() {
  requestAnimationFrame(tick);
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
